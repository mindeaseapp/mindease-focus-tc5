name: mindease_focus
description: MindEase Focus – TC5 FINAL Professional Setup
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 🔁 Gerenciamento de estado (ThemeController)
  provider: ^6.0.5

  # 🖼 SVG (opcional, mas já configurado)
  flutter_svg: ^2.2.3
  supabase_flutter: ^2.0.0
  
  # 🔔 Notificações locais
  flutter_local_notifications: ^17.0.0
  
  # 🌐 Suporte Web para notificações
  web: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # 📂 Assets
  assets:
    - assets/fonts/

  # 🔤 Fontes — Inter
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
